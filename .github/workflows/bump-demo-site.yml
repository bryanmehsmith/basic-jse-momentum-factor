name: Bump demo-site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo-site
        uses: actions/checkout@v4
        with:
          repository: bryanmehsmith/demo-site
          token: ${{ secrets.DEMO_SITE_PAT }}

      - name: Bump momentum-factor submodule to this commit
        env:
          NEW_SHA: ${{ github.sha }}
        run: |
          CURRENT_SHA=$(git rev-parse HEAD:apps/momentum-factor)
          if [ "$CURRENT_SHA" = "$NEW_SHA" ]; then
            echo "demo-site already points at $NEW_SHA, nothing to do."
            exit 0
          fi
          git update-index --cacheinfo 160000,"$NEW_SHA",apps/momentum-factor
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump momentum-factor demo to ${NEW_SHA:0:7}"
          git push
